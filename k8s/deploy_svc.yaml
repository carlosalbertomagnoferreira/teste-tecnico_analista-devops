apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-php
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-app
  template:
    metadata:
      labels:
        app: php-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: app-php
        image: magnocarlos1988/teste-tecnico_analista-devops:latest
        env:
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: php-app
              key: app-key
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 82
          runAsNonRoot: true
          runAsUser: 82
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: laravel-storage
          mountPath: /var/www/html/storage
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: laravel-storage
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: php-app
spec:
  selector:
    app: php-app
  ports:
  - port: 80
    targetPort: http
  type: LoadBalancer
